services:
  postgres:
    image: postgres:16-alpine
    container_name: dk-fitt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dk_fitt
    ports:
      - "5432:5432"
    volumes:
      - dk_fitt_pgdata:/var/lib/postgresql/data

volumes:
  dk_fitt_pgdata:
